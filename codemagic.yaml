workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 120
    environment:
      android_sdk: 34
      java: 17
      groups:
        - google_play
    triggering:
      events:
        - push
        - pull_request
      branch:
        include:
          - main
          - develop
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Run Lint
        script: |
          ./gradlew lint
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/lint-results.html
    publishing:
      email:
        recipients:
          - $PERSONAL_EMAIL
        notify:
          success: true
          failure: true

  android-debug:
    name: Android Debug Build
    max_build_duration: 90
    environment:
      android_sdk: 34
      java: 17
    triggering:
      events:
        - push
      branch:
        include:
          - develop
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
